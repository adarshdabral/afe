# Deploy to Cloudflare Workers (GitHub Actions alternative to Workers Builds).
# Manual trigger by default — see DEPLOY.md. Requires repo secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SESSION_SECRET
# Recommended path is Cloudflare Workers Builds (dashboard); this is provided for
# teams who prefer GitHub-native CI. Confirm the deploy command matches the Nitro
# output on first run.
name: Deploy

on:
  workflow_dispatch: {}
  # Flip this on once secrets are configured and a first manual run succeeds:
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile || bun install

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
