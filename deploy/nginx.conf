# ai-spark — nginx reverse proxy
# Install: /etc/nginx/sites-available/ai-spark  (symlink into sites-enabled)
#
# Single-origin layout so the httpOnly `afe_session` cookie (sameSite=lax,
# secure) works with zero CORS friction:
#     https://DOMAIN/        -> Next.js   (127.0.0.1:3000)
#     https://DOMAIN/api/... -> Express   (127.0.0.1:4000, /api prefix preserved)
#
# Replace __DOMAIN__ with your domain (or <EC2_PUBLIC_IP>.sslip.io if you have
# no domain yet — sslip.io resolves that name to the embedded IP, which lets
# certbot issue a real Let's Encrypt cert so the `secure` auth cookie works).
# `certbot --nginx` rewrites this to add the :443 TLS server + HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 10M;

    # --- Express API: preserve the /api prefix (routes are mounted at /api/*) ---
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Next.js frontend ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
