# Apache reverse proxy for ai-spark — faithful port of deploy/nginx.conf.
# Single origin: /api/* → backend app :4000, everything else → frontend app :3000.
# TLS terminates here with the existing self-signed sslip.io cert.

<VirtualHost *:80>
    ServerName 13-205-19-221.sslip.io
    ServerAlias 13.205.19.221
    # Preserve host + full URI on the redirect, exactly like nginx.
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName 13-205-19-221.sslip.io
    ServerAlias 13.205.19.221

    SSLEngine on
    # Let's Encrypt cert for 13-205-19-221.sslip.io (auto-renewed by certbot.timer;
    # deploy hook reloads Apache). Was a self-signed cert under /etc/ssl/ai-spark/.
    SSLCertificateFile    /etc/letsencrypt/live/13-205-19-221.sslip.io/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/13-205-19-221.sslip.io/privkey.pem

    # Allow lesson uploads: documents/images (API cap 25 MB) and lesson videos
    # (API cap 500 MB, UPLOAD_VIDEO_MAX_BYTES). 520 MB leaves room for multipart overhead.
    LimitRequestBody 545259520
    # Large video uploads/streams over slow links: don't cut the proxy off at 60s.
    ProxyTimeout 900

    ProxyRequests Off
    ProxyPreserveHost On
    # The app sits behind the proxy; forward the real scheme (https) so the
    # `secure` afe_session cookie flow works (matches nginx X-Forwarded-Proto).
    RequestHeader set X-Forwarded-Proto "https"

    # Never let browsers cache the HTML shell: it references content-hashed JS
    # chunks, so stale HTML would point at chunks that no longer exist after a
    # deploy (login button silently dies). Assets under /_next/static are
    # content-hashed and remain immutable, so only HTML is forced to revalidate.
    <IfModule mod_headers.c>
        Header always unset Cache-Control "expr=%{CONTENT_TYPE} =~ m#text/html#"
        Header always set Cache-Control "no-cache, no-store, must-revalidate" "expr=%{CONTENT_TYPE} =~ m#text/html#"
    </IfModule>

    # API → backend app :4000 (keep the /api/ prefix). Listed first so it wins.
    ProxyPass        /api/ http://127.0.0.1:4000/api/
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/

    # Everything else → frontend app :3000, with WebSocket upgrade support
    ProxyPass        /     http://127.0.0.1:3000/ upgrade=websocket
    ProxyPassReverse /     http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/ai-spark-error.log
    CustomLog ${APACHE_LOG_DIR}/ai-spark-access.log combined
</VirtualHost>
