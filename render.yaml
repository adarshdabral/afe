# Render Blueprint for the ai-spark BACKEND (Next.js API app in backend/).
# Render → New → Blueprint → pick this repo. The frontend deploys separately on
# Vercel (Root Directory: frontend). See DEPLOY.md.
services:
  - type: web
    name: ai-spark-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start            # next start — listens on Render's $PORT
    healthCheckPath: /api/health
    # Lesson media (videos, audio, PDFs/PPTs, subtitles) is stored in Cloudflare R2
    # once the R2_* variables below are set — then the disk is only a fallback and
    # can be removed (download anything already on it first), and the free plan
    # works too (but free instances sleep after ~15 min idle).
    # Without R2, the Persistent Disk (paid instances only) keeps uploads across deploys.
    plan: starter
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false                    # set in the dashboard (Atlas SRV string)
      - key: JWT_SECRET
        generateValue: true            # random secret (≥32 chars)
      - key: APP_PUBLIC_URL
        sync: false                    # the frontend URL, e.g. https://ai-spark.vercel.app
      - key: CORS_ORIGIN
        sync: false                    # same frontend URL (comma-separate several)
      - key: REQUIRE_TEACHER_APPROVAL
        value: "false"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Cloudflare R2 (lesson media) — see DEPLOY.md "Cloudflare R2 + Workers AI".
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false                    # https://pub-xxxx.r2.dev or your custom media domain
      # Cloudflare Workers AI (text-to-speech narration)
      - key: CLOUDFLARE_AI_TOKEN
        sync: false
      # Demo-account passwords. Leave blank to use the documented defaults
      # (Student@123 / Teacher@123 / Admin@123); set strong values for production.
      - key: SEED_STUDENT_PASSWORD
        sync: false
      - key: SEED_TEACHER_PASSWORD
        sync: false
      - key: SEED_PLATFORM_ADMIN_PASSWORD
        sync: false
